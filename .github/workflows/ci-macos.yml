name: CI Mac

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_mac:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.13.5
      uses: actions/setup-python@v3
      with:
        python-version: "3.13.5"

    - name: Run make install_for_mac
      run: make install_for_mac

    - name: Run make html
      run: make html

    - name: Run make pdf
      run: make pdf

    - name: Inspect latex.log
      run: type latex.log

