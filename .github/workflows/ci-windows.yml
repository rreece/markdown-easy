name: CI Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.13.5
      uses: actions/setup-python@v3
      with:
        python-version: "3.13.5"

    - name: Update PATH
      run: Add-Content $env:GITHUB_PATH "C:\\texlive\\2026\\bin\\windows"

    - name: Run make install_for_windows
      run: make install_for_windows

    - name: Run make html
      run: make html

    - name: Run make pdf
      run: make pdf

